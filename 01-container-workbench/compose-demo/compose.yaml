name: devops-status-lab
services:
  api:
    build:
      context: ../service-status-api
    image: service-status:2024
    environment:
      PORT: "8080"
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-false}"
    restart: unless-stopped
    networks: [lab_net]
    # Dockerfile has a readiness healthcheck; do not publish this port.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  proxy:
    image: nginx:1.26.2-alpine3.20
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks: [lab_net]
    security_opt:
      - no-new-privileges:true
networks:
  lab_net:
    driver: bridge
