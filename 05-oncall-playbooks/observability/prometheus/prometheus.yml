global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: 'oncall-demo'
    metrics_path: /metrics
    static_configs:
      - targets: ['service:8080']
        labels:
          environment: local-lab
