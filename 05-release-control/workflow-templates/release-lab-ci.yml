# Copy this into <repo>/.github/workflows/ before GitHub can run it.
name: Release lab checks
on:
  pull_request:
    paths:
      - 'release-control/**'
  push:
    branches: [main]
    paths:
      - 'release-control/**'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - run: npm test
        working-directory: release-control/parcel-api
  release-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: release-control
      - run: python -m pytest -q
        working-directory: release-control
