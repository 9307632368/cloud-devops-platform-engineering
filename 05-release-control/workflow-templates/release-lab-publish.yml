# Manual image publish; requires package write access for the repo.
name: Release lab publish image
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version (example: v1.2.0)'
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and set lowercase image name
        id: image
        env:
          VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9.-]+)?$ ]]; then
            echo 'Invalid version'; exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parcel-release-lab" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: ./release-control/parcel-api
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.release_version }}
      - name: Show immutable digest for promotion
        run: |
          echo "Digest: ${{ steps.docker.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the version AND digest when running tools/release.py promote.' >> "$GITHUB_STEP_SUMMARY"
