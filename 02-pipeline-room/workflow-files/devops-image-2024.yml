name: DevOps lab - Docker image (2024)

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-room/build-lab/**'
      - '.github/workflows/devops-image-2024.yml'
  pull_request:
    paths:
      - 'pipeline-room/build-lab/**'
      - '.github/workflows/devops-image-2024.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image path (registry wants lowercase names)
        shell: bash
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/release-status-api" >> "$GITHUB_OUTPUT"

      - name: Sign in to GHCR only on a push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build on PR, publish on main
        uses: docker/build-push-action@v6
        with:
          context: ./pipeline-room/build-lab
          file: ./pipeline-room/build-lab/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
